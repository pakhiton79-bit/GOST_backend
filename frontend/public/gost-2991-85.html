<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/account.css">
<script src="/js/common-settings.js"></script>

<script src="/js/account/standards.js"></script>
<style>
  .type-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:24px;
    padding:20px;
    border:1px solid var(--border-input);
    border-radius:12px;
    background:var(--panel);
    text-decoration:none;
    color:var(--ink);
    margin-bottom:16px;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .type-badge{
    position:absolute;
    top:-10px;
    right:16px;
    padding:4px 12px;
    border-radius:999px;
    background:var(--warn);
    color:#ffffff;
    font-size:12px;
    font-weight:600;
    line-height:1.4;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
    pointer-events:none;
  }
  /* Более яркий (красный) вариант обычной жёлтой плашки - для типа, который
     ещё не проверен на чертежах вовсе (см. badgeDanger в TYPES ниже). */
  .type-badge-danger{
    background:var(--error);
  }
  /* Тип проверен контрольным примером - зелёная плашка вместо жёлтой
     (см. badgeOk в TYPES ниже). */
  .type-badge-ok{
    background:var(--ok);
  }
  /* Тип без страницы (плашка «Появится позже», badgeSoon): карточка не
     нажимается и приглушена, плашка серая. */
  .type-card-off{cursor:default;}
  .type-card-off:hover{border-color:var(--border-input);background:var(--panel);}
  .type-card-off .type-info h3{color:var(--ink-soft);}
  .type-badge-soon{background:var(--ink-soft);}
  .type-info{flex:1;min-width:0;}
  .type-info h3{
    font-size:18px;
    font-weight:600;
    margin:0;
    color:var(--ink);
  }
  .type-image{
    flex:0 0 160px;
    width:160px;
    height:120px;
    border-radius:8px;
    border:1px solid var(--border-input);
    overflow:hidden;
    background:#ffffff;
  }
  .type-image img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
  }
  @media (max-width:560px){
    .type-card{flex-direction:column;align-items:stretch;}
    .type-image{width:100%;flex-basis:auto;}
  }
  /* Наведение (вариант D, по выбору пользователя): тёплый фон, мягкая
     коричневая рамка, название сдвигается на 4 px. */
  .type-info h3{transition:transform .2s ease;}
  .type-card:not(.type-card-off):hover, .type-card:focus-visible{
    border-color:color-mix(in srgb, var(--accent) 40%, var(--border-input));
    background:var(--panel-hover);
  }
  .type-card:not(.type-card-off):hover .type-info h3, .type-card:focus-visible .type-info h3{transform:translateX(4px);}
  @media (prefers-reduced-motion:reduce){
    .type-info h3{transition:none;}
    .type-card:hover .type-info h3, .type-card:focus-visible .type-info h3{transform:none;}
  }
</style>
</head>
