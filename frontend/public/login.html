<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход - Тара+</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/account.css">
<script src="/js/common-settings.js"></script>
<script src="/js/common-account.js"></script>
</head>
<body class="auth-page">
<div class="auth-split">
  <!-- Слева - коллаж из чертежей сайта (декоративный). -->
  <aside class="auth-art" aria-hidden="true">
    <svg class="auth-art-lines" viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <path d="M1000 90 H880 a40 40 0 0 0 -40 40 V390 a40 40 0 0 1 -40 40 H660"/>
      <path d="M340 560 H210 a40 40 0 0 0 -40 40 V880 a40 40 0 0 1 -40 40 H0"/>
    </svg>
    <img class="auth-art-img" src="/images/box_ii1.png" alt="" loading="lazy" style="left:4%;top:5%;width:34%;--r:-6deg">
    <img class="auth-art-img" src="/images/dno.png" alt="" loading="lazy" style="left:40%;top:3%;width:36%;--r:4deg">
    <img class="auth-art-img" src="/images/torec_ii1_1floor_3posts_x.jpg" alt="" loading="lazy" style="left:-6%;top:36%;width:34%;--r:8deg">
    <img class="auth-art-img" src="/images/box_iii1.png" alt="" loading="lazy" style="left:66%;top:38%;width:30%;--r:-5deg">
    <img class="auth-art-img" src="/images/kryshka_2beams.jpg" alt="" loading="lazy" style="left:2%;top:74%;width:30%;--r:-3deg">
    <img class="auth-art-img" src="/images/box_i2.png" alt="" loading="lazy" style="left:36%;top:76%;width:24%;--r:6deg">
    <img class="auth-art-img" src="/images/bokovoy_3p_2r.jpg" alt="" loading="lazy" style="left:62%;top:72%;width:36%;--r:-7deg">
    <img class="auth-art-img" src="/images/box_i4.png" alt="" loading="lazy" style="left:72%;top:14%;width:26%;--r:9deg">
    <div class="auth-art-card">
      <div class="auth-art-card-title"><b class="auth-art-brand">Тара+</b><br>Точные расчёты<br>тары по&nbsp;ГОСТ</div>
      <div class="auth-art-pill">Таблица деталей</div>
      <div class="auth-art-pill">Чертежи узлов</div>
      <div class="auth-art-pill">Объём и нормы времени</div>
    </div>
  </aside>

  <main class="auth-main">
    <div class="auth-box">
      <a class="auth-logo" href="index.html"><img src="/images/favicon.png" alt=""><span>Тара+</span></a>
      <h1 class="auth-title" id="authTitle">Вход</h1>
      <p class="auth-sub" id="authSub"></p>
      <div class="auth-msg" id="authMsg" hidden></div>
      <form id="authForm" novalidate>
        <p class="auth-text" id="authText" hidden></p>
        <div class="auth-field" data-field="email">
          <label for="authEmail">Электронная почта <span class="auth-req">*</span></label>
          <input type="email" id="authEmail" autocomplete="email" maxlength="254">
        </div>
        <div class="auth-field" data-field="code">
          <label for="authCode">Код из письма <span class="auth-req">*</span></label>
          <input type="text" id="authCode" class="auth-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
        </div>
        <div class="auth-field" data-field="password">
          <div class="auth-label-row">
            <label for="authPassword"><span id="authPasswordLabel">Пароль</span> <span class="auth-req">*</span></label>
            <a class="auth-forgot" data-mode="forgot" id="authForgot">Забыли пароль?</a>
          </div>
          <div class="auth-pw">
            <input type="password" id="authPassword" autocomplete="current-password" maxlength="200">
            <button type="button" class="auth-eye" data-eye="authPassword" aria-label="Показать пароль"></button>
          </div>
        </div>
        <div class="auth-field" data-field="password2">
          <label for="authPassword2">Пароль ещё раз <span class="auth-req">*</span></label>
          <div class="auth-pw">
            <input type="password" id="authPassword2" autocomplete="new-password" maxlength="200">
            <button type="button" class="auth-eye" data-eye="authPassword2" aria-label="Показать пароль"></button>
          </div>
        </div>
        <button type="submit" class="auth-submit" id="authSubmit">Войти</button>
      </form>
      <div class="auth-links" id="authLinks"></div>
      <div class="auth-switch" id="authSwitch"></div>
      <a class="auth-home" href="index.html">← На главную</a>
    </div>
  </main>
</div>
<script src="/js/account/login.js"></script>
</body>
</html>
