<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Выбор ГОСТ - Тара+</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/account.css">
<script src="/js/common-settings.js"></script>
<script src="/js/common-account.js"></script>
<script src="/js/account/standards.js"></script>
<style>
  .gost-list{display:flex;flex-direction:column;gap:16px;}
  .gost-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:18px 20px;
    border:1px solid var(--border-input);
    border-radius:10px;
    background:var(--panel);
    color:var(--ink);
    text-decoration:none;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .gost-link:hover{
    border-color:var(--accent);
    background:var(--accent-wash);
  }
  .gost-link .gost-name{font-size:16px;font-weight:600;}
  /* ГОСТ в работе (по указанию пользователя): карточка не нажимается, без
     стрелки и без подсветки, красная плашка - как у типов (.type-badge). */
  .gost-link{position:relative;}
  .gost-link-off{cursor:default;}
  .gost-link-off:hover{border-color:var(--border-input);background:var(--panel);}
  .gost-badge{
    position:absolute;
    top:-10px;
    right:16px;
    padding:4px 12px;
    border-radius:999px;
    background:var(--error);
    color:#ffffff;
    font-size:12px;
    font-weight:600;
    line-height:1.4;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
    pointer-events:none;
  }
  .gost-link .arrow{color:var(--accent);font-size:18px;line-height:1;flex:none;}
  .empty-note{color:var(--ink-soft);font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-nav">
    <a href="index.html?about">← О сервисе</a>
    <a href="index.html?about">Главная</a>
  </div>
  <header>
    <h1>Выберите ГОСТ</h1>
    <div class="subtitle">Стандарт, по которому рассчитать ящик</div>
  </header>

  <div id="gosts"></div>
</div>

<script>
const GOSTS = [
  {
    gost: 'ГОСТ 10198-91',
    title: 'Ящики дощатые неразборные для грузов массой до 3000 кг',
    file: 'gost-10198-91.html'
  },
  {
    gost: 'ГОСТ 2991-85',
    title: 'Ящики дощатые неразборные для грузов массой до 500 кг',
    badge: 'В работе'
  }
];

(function(){
  const root = document.getElementById('gosts');
  if(!GOSTS.length){
    root.innerHTML = '<div class="card"><span class="empty-note">ГОСТы ещё не добавлены.</span></div>';
    return;
  }
  let html = '<div class="gost-list">';
  GOSTS.forEach(g => {
    const badge = g.badge ? `<span class="gost-badge">${g.badge}</span>` : '';
    // Без file - ГОСТ в работе: карточка не ссылка.
    if(!g.file){
      html += `<div class="gost-link gost-link-off" aria-disabled="true">${badge}<div class="gost-name">${g.gost}</div></div>`;
      return;
    }
    html += `<a class="gost-link" href="${g.file}">
      ${badge}<div class="gost-name">${g.gost}</div>
      <span class="arrow">→</span>
    </a>`;
  });
  html += '</div>';
  root.innerHTML = html;
})();
</script>
</body>
</html>
