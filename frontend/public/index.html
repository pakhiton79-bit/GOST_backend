<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOODCALC — калькуляторы тары</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .wrap{max-width:760px;}
  .gost-list{display:flex;flex-direction:column;gap:10px;}
  .gost-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:18px 20px;
    border:1px solid var(--border-input);
    border-radius:10px;
    background:#ffffff;
    color:var(--ink);
    text-decoration:none;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .gost-link:hover{
    border-color:var(--accent);
    background:var(--accent-wash);
  }
  .gost-link .gost-name{font-size:16px;font-weight:600;}
  .gost-link .arrow{color:var(--accent);font-size:18px;line-height:1;flex:none;}
  .empty-note{color:var(--ink-soft);font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Калькуляторы производства тары</h1>
    <div class="subtitle">Выберите ГОСТ</div>
  </header>

  <div id="gosts"></div>
</div>

<script>
const GOSTS = [
  {
    gost: 'ГОСТ 10198-91',
    title: 'Ящики дощатые неразборные для грузов массой до 3000 кг',
    file: 'gost-10198-91.html'
  }
];

(function(){
  const root = document.getElementById('gosts');
  if(!GOSTS.length){
    root.innerHTML = '<div class="card"><span class="empty-note">ГОСТы ещё не добавлены.</span></div>';
    return;
  }
  let html = '<div class="gost-list">';
  GOSTS.forEach(g => {
    html += `<a class="gost-link" href="${g.file}">
      <div class="gost-name">${g.gost}</div>
      <span class="arrow">→</span>
    </a>`;
  });
  html += '</div>';
  root.innerHTML = html;
})();
</script>
</body>
</html>
