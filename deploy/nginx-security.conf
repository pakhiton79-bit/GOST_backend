# nginx: общая защита (по указанию пользователя, после аудита). Кладётся в
# /etc/nginx/conf.d/taraplus-security.conf - действует для всех сайтов
# сервера (README.md, раздел 5а).
#
#  - nginx не называет свою версию в ответах и на страницах ошибок;
#  - запросы к API (/api/...) с одного IP: в среднем не больше 20 в секунду,
#    короткий всплеск до 60 - без задержки; сверх - ответ 429. Страницы,
#    картинки и скрипты не ограничиваются (у них пустой ключ);
#  - одновременных соединений с одного IP - не больше 100 (офис за одним
#    IP с несколькими браузерами укладывается).
# Внутри сайта свои, более строгие лимиты (вход, коды, расчёты) - эти
# только отсекают поток запросов раньше, чем он дойдёт до Node.js.
server_tokens off;

map $uri $taraplus_api_ip {
    ~^/api/  $binary_remote_addr;
    default  "";
}
limit_req_zone $taraplus_api_ip zone=taraplus_api:10m rate=20r/s;
limit_req zone=taraplus_api burst=60 nodelay;
limit_req_status 429;

limit_conn_zone $binary_remote_addr zone=taraplus_conn:10m;
limit_conn taraplus_conn 100;
limit_conn_status 429;
